<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f6f1">
<title>Sign in | Interior Solutions</title>
<style>
:root{color-scheme:light;--ink:#23332b;--muted:#65756b;--green:#356a4e;--line:#dce5dd;--wash:#f3f6f1}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:750;letter-spacing:.01em}.tag{color:var(--muted);font-size:12px;margin-top:2px}
main{max-width:1100px;margin:34px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 8px 28px #163d2410}
h1{font-size:25px;line-height:1.2;margin:0 0 8px}h2{font-size:18px;margin:0 0 6px}p{color:var(--muted);margin:0 0 18px}
label{display:block;font-weight:650;font-size:13px;margin:0 0 6px}input,select{display:block;width:100%;padding:11px 12px;border:1px solid #cbd8cd;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.span-2{grid-column:1/-1}
button,.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:var(--green);color:#fff;padding:11px 16px;font:650 14px system-ui;cursor:pointer;text-decoration:none}
button.secondary{background:#fff;color:var(--green);border:1px solid #b9ccbd}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.status{padding:10px 12px;border-radius:8px;background:#edf4ee;color:#315d40;margin:14px 0 0;white-space:pre-wrap}.status.error{background:#fff1ef;color:#9a3224}
.notice{font-size:12px;background:#f7f9f6;border:1px solid var(--line);padding:11px 13px;border-radius:8px;color:#53645a;margin:16px 0 0}
.hidden{display:none!important}.topline{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #e8eee8;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64756a;background:#f8faf8;position:sticky;top:0}td{font-size:13px}tr:last-child td{border-bottom:0}.summary{max-width:380px;white-space:pre-wrap}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#eef4ee;font-size:11px;color:#42654b}
#qr{display:block;max-width:190px;max-height:190px;margin:12px auto;border:1px solid var(--line);padding:8px;border-radius:8px;background:#fff}.back{color:var(--green);text-decoration:none;font-size:13px}
@media(max-width:620px){.auth-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.card{padding:18px}header{padding:15px 18px}.topline{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div><div class="brand">Interior Solutions · Project Work</div><div class="tag">Project dashboard</div></div></header>
<main>
<section id="authCard" class="card">
<h1>Sign in to your dashboard</h1>
<p>Use your verified Interior Solutions email and password. New accounts also need the project access code once.</p>
<form id="authForm" class="auth-grid">
<div class="span-2"><label for="email">Company email</label><input id="email" type="email" autocomplete="username" required placeholder="you@interiorsolutions.net"></div>
<div id="accessCodeField" class="span-2 hidden"><label for="accessCode">Project access code</label><input id="accessCode" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>
<div class="span-2"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div>
<div id="confirmPasswordField" class="span-2 hidden"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div>
<div class="span-2 actions"><button id="submitAuth" type="submit">Sign in</button><button id="toggleMode" class="secondary" type="button">Create account</button></div>
</form>
<div id="authStatus" class="status hidden" role="status"></div>
<div class="notice">Your account shows the project records assigned to you.</div>
</section>
<section id="recordsCard" class="hidden"></section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
const SUPABASE_URL = 'https://qyeelndmdqptybsghmjm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Wh0weQys-eyO5-Tk8h1lUA_f6rFB34f';
const COMPANY_DOMAIN = '@interiorsolutions.net';
const db = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const byId = id => document.getElementById(id);
const authCard = byId('authCard'), recordsCard = byId('recordsCard');
const authStatus = byId('authStatus');
let authMode = 'signin';
function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function status(el, message, error) { el.textContent = message; el.classList.toggle('hidden', !message); el.classList.toggle('error', !!error); }
function show(screen) { authCard.classList.toggle('hidden', screen !== 'auth'); recordsCard.classList.toggle('hidden', screen !== 'records'); }
function setAuthMode(mode) { authMode = mode; byId('accessCodeField').classList.toggle('hidden', mode !== 'signup'); byId('accessCode').required = mode === 'signup'; byId('confirmPasswordField').classList.toggle('hidden', mode !== 'signup'); byId('confirmPassword').required = mode === 'signup'; byId('password').autocomplete = mode === 'signup' ? 'new-password' : 'current-password'; byId('submitAuth').textContent = mode === 'signup' ? 'Create account' : 'Sign in'; byId('toggleMode').textContent = mode === 'signup' ? 'I already have an account' : 'Create account'; status(authStatus, '', false); }
byId('toggleMode').addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin'));
byId('authForm').addEventListener('submit', async event => {
  event.preventDefault(); status(authStatus, 'Connecting…', false);
  const email = byId('email').value.trim().toLowerCase(), password = byId('password').value;
  const accessCode = byId('accessCode').value.trim().toUpperCase();
  const confirmPassword = byId('confirmPassword').value;
  if (!email.endsWith(COMPANY_DOMAIN)) { status(authStatus, 'Use your @interiorsolutions.net email address.', true); return; }
  if (authMode === 'signup') {
    if (password !== confirmPassword) { status(authStatus, 'The passwords do not match. Re-enter them and try again.', true); return; }
    if (!accessCode) { status(authStatus, 'Enter the project access code to create an account.', true); return; }
    const { data: accessAllowed, error: accessError } = await db.rpc('prepare_dashboard_registration', { p_email: email, p_access_code: accessCode });
    if (accessError) { status(authStatus, 'Could not validate the project access code: ' + accessError.message, true); return; }
    if (accessAllowed !== true) { status(authStatus, 'That email or project access code is not valid for registration.', true); return; }
    const { data, error } = await db.auth.signUp({ email, password, options: { emailRedirectTo: new URL('/backend-test.html', window.location.origin).href } });
    if (error) { status(authStatus, error.message, true); return; }
    if (!data.session) { status(authStatus, 'Account created. Check your company inbox to confirm your email, then return here and sign in.', false); return; }
    await continueAfterSignIn(data.session.user);
  } else {
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) { status(authStatus, error.message, true); return; }
    await continueAfterSignIn(data.user);
  }
});
async function continueAfterSignIn(user) {
  const email = (user?.email || '').trim().toLowerCase();
  if (!email.endsWith(COMPANY_DOMAIN)) {
    await db.auth.signOut();
    show('auth'); status(authStatus, 'Use your @interiorsolutions.net email address.', true); return;
  }
  if (!user.email_confirmed_at) {
    await db.auth.signOut();
    show('auth'); status(authStatus, 'Confirm your company email using the link we sent before signing in.', true); return;
  }
  window.location.replace('/');
}
async function loadRecords() { window.location.replace('/'); }
(async function start() {
  const { data, error } = await db.auth.getSession();
  if (error) { show('auth'); status(authStatus, error.message, true); return; }
  if (data.session) await continueAfterSignIn(data.session.user); else { show('auth'); setAuthMode('signin'); }
})();
</script>
</body></html>
